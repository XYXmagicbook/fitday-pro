<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<div id="frame">

  <nav id="tabbar" class="hidden">
    <button class="tab" data-nav="home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>首页</span>
    </button>
    <button class="tab" data-nav="fitness">
      <svg viewBox="0 0 24 24"><path d="M2 12h2m16 0h2M6 8v8m12-8v8M4 9.5v5m16-5v5M8 12h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>训练</span>
    </button>
    <button class="tab" data-nav="diet">
      <svg viewBox="0 0 24 24"><path d="M4 11a8 8 0 0 1 16 0Zm0 0h16M6 11v7a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-7M12 3V1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>

    </button>
    <button class="tab" data-nav="me">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>我的</span>
    </button>
  </nav>

  <div id="toast" class="hidden"></div>
  <div id="sheetwrap" class="hidden"><div class="sheet-mask" data-action="closeSheet"></div><div class="sheet" id="sheet"></div></div>
  <div id="modalwrap" class="hidden"><div class="modal-mask" data-action="closeModal"></div><div class="modal" id="modal"></div></div>
</div>
